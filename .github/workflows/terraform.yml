name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main # Пайплайн запуститься тільки при push в гілку main

jobs:
  terraform:
    runs-on: ubuntu-latest # Просимо GitHub виділити нам чистий сервер на Linux
    steps:
      - name: Checkout repository # Це і є наш автоматичний "git clone"
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
        env:
          HCLOUD_TOKEN: ${{secrets.HCLOUD_TOKEN}}