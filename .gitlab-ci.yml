image: 
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - validate
  - plan
  - apply

terraform_validate:
  stage: validate
  script:
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate

terraform_plan:
  stage: plan
  script:
    - terraform init
    - terraform plan

terraform_apply:
  stage: apply
  script:
    - terraform init
    - terraform apply -auto-approve

variables:
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: ${CI_JOB_TOKEN}